name: Release

# Runs for v* tags, normally created by release-please as a draft release. GoReleaser
# uploads the signed artifacts to that draft and then publishes it, so the Terraform
# Registry only sees complete releases.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      JUMPCLOUD_API_KEY: ${{ secrets.JUMPCLOUD_API_KEY }}
      JUMPCLOUD_ORG_ID: ${{ secrets.JUMPCLOUD_ORG_ID }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Unit tests
        run: go test -count=1 ./...
      - uses: hashicorp/setup-terraform@v4.0.1
        if: env.JUMPCLOUD_API_KEY != ''
        with:
          terraform_wrapper: false
      - name: Acceptance tests
        if: env.JUMPCLOUD_API_KEY != ''
        run: make testacc

      - name: Import GPG key
        id: import_gpg
        uses: crazy-max/ghaction-import-gpg@v7.0.0
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7.2.3
        with:
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}
