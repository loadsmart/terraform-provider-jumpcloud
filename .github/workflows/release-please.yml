name: Release Please

# Same flow as loadsmart/terraform-modules: release-please opens a release PR from the
# conventional commits on main and the Rollbot app merges it right away, so every
# feat: or fix: ships. Merging creates a draft release and its tag; the tag starts
# release.yml, which uploads the signed artifacts and publishes the release.
on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Pushes made with GITHUB_TOKEN do not trigger workflows, so the app token is
      # what lets the release tag start release.yml.
      - name: Create Rollbot token
        id: app-token
        uses: actions/create-github-app-token@v3.2.0
        with:
          client-id: ${{ vars.ROLLBOT_CLIENT_ID }}
          private-key: ${{ secrets.ROLLBOT_APP_PRIVATE_KEY }}

      - id: release
        uses: googleapis/release-please-action@v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Merge release PR
        if: steps.release.outputs.prs_created == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RELEASE_PRS: ${{ steps.release.outputs.prs }}
        run: |
          jq -r '.[].number' <<< "$RELEASE_PRS" |
            while read -r pr; do
              gh pr merge "$pr" --repo "$GITHUB_REPOSITORY" --squash --admin
            done
