name: Release Please

on:
  push:
    branches: [main]

permissions: {}

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Pushes made with GITHUB_TOKEN do not trigger workflows, so the app token is
      # what lets the release tag start release.yml.
      - name: Create Rollbot token
        id: app-token
        uses: actions/create-github-app-token@v3.2.0
        with:
          client-id: ${{ vars.ROLLBOT_CLIENT_ID }}
          private-key: ${{ secrets.ROLLBOT_APP_PRIVATE_KEY }}

      - id: release
        uses: googleapis/release-please-action@v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Merge release PR
        if: steps.release.outputs.prs_created == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: gh pr merge "${{ fromJSON(steps.release.outputs.pr).number }}" --repo "$GITHUB_REPOSITORY" --squash --admin
